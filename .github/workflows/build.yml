name: Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run unit tests
        run: |
          dotnet build tests/TestOverlay.App.Tests/TestOverlay.App.Tests.csproj -c Release -o artifacts/tests --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet artifacts/tests/TestOverlay.App.Tests.dll -noLogo -xml artifacts/unit-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build detection probe
        run: dotnet build tools/TestOverlay.DetectionProbe/TestOverlay.DetectionProbe.csproj -c Release -o artifacts/detection-probe --nologo
      - name: Verify isolated storage and cross-process activation
        run: |
          dotnet build tools/TestOverlay.TestLab/TestOverlay.TestLab.csproj -c Release -o artifacts/test-lab --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MABINOGI_OVERLAY_TEST_ROOT = Join-Path $PWD 'artifacts/lab-data'
          dotnet artifacts/test-lab/TestOverlay.TestLab.dll --verify-sandbox --test-lab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content artifacts/lab-data/verification.txt
      - name: Measure synthetic CPU composition
        run: ./scripts/run-performance-probe.ps1
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            artifacts/unit-tests.xml
            artifacts/lab-data/verification.txt
            artifacts/performance-*.json
          if-no-files-found: warn
